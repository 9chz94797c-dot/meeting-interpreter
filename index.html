<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Interpreter">
<title>Meeting Interpreter</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171f;--sub:#6b7280;--line:#e3e6ec;--acc:#0b57d0;--rec:#d93025}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--ink:#eef0f4;--sub:#98a1b0;--line:#2a2f3a;--acc:#7aa7ff;--rec:#ff6b5e}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 8px 0 0}
button{font:inherit;font-size:15px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.rec{background:var(--rec);border-color:var(--rec);color:#fff;font-weight:600}
button:disabled{opacity:.5}
input,textarea,select{font:inherit;font-size:15px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:6px;margin-left:auto}
.tabs button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
#status{font-size:13px;color:var(--sub)}
#spk{display:flex;gap:6px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto}
#spk button{padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
#spk button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{flex:1;overflow-y:auto;padding:12px 14px;-webkit-overflow-scrolling:touch}
.pane{display:none}.pane.on{display:block}
.seg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.meta{font-size:12px;color:var(--sub);margin-bottom:4px}
.meta b{color:var(--acc)}
.ko{font-size:21px;line-height:1.45;font-weight:500}
.en{font-size:14px;color:var(--sub);margin-top:4px;line-height:1.4}
.err{color:var(--rec);font-size:14px}
#interim{padding:8px 14px;font-size:14px;color:var(--sub);background:var(--card);border-top:1px solid var(--line);min-height:36px;font-style:italic}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
#minutes{min-height:60vh;line-height:1.5;font-size:15px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4}
</style>
</head>
<body>
<header>
  <h1>Meeting Interpreter</h1>
  <button id="btnRec" class="primary">● 시작</button>
  <span id="status">대기 중</span>
  <div class="tabs">
    <button data-tab="live" class="on">실시간</button>
    <button data-tab="minutes">회의록</button>
    <button data-tab="settings">설정</button>
  </div>
</header>
<div id="spk"></div>

<main>
  <section id="p-live" class="pane on"><div id="list"></div></section>

  <section id="p-minutes" class="pane">
    <label>회의 제목</label><input id="title" placeholder="예: NA Kitchen Q4 Sell-in Review">
    <label>참석자 (선택)</label><input id="attendees" placeholder="예: Simon(LG), John(Retailer A), Sarah(Retailer A)">
    <div class="row">
      <button id="btnMin" class="primary">회의록 생성</button>
      <button id="btnCopy">복사</button>
      <button id="btnShare">공유/저장</button>
      <button id="btnTx">원문 스크립트 공유</button>
    </div>
    <label>회의록 (직접 수정 가능)</label>
    <textarea id="minutes" placeholder="회의 종료 후 '회의록 생성'을 누르세요."></textarea>
  </section>

  <section id="p-settings" class="pane">
    <label>Anthropic API Key</label>
    <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
    <div class="hint">이 기기의 브라우저에만 저장됩니다. 프로토타입 용도이며, 사내 기밀 회의에는 사내 보안 정책 확인 후 사용하세요.</div>
    <label>번역 모델 (속도 우선 권장)</label>
    <select id="mTr"><option value="claude-haiku-5-5">claude-haiku-5-5 (빠름)</option><option value="claude-sonnet-5-5">claude-sonnet-5-5 (정확)</option></select>
    <label>회의록 모델</label>
    <select id="mMin"><option value="claude-sonnet-5-5">claude-sonnet-5-5</option><option value="claude-opus-5-5">claude-opus-5-5</option></select>
    <label>음성 인식 언어</label>
    <select id="lang"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select>
    <label>화자 이름 (쉼표 구분, 실시간 화면에서 탭하여 전환)</label>
    <input id="speakers" placeholder="나,A,B,C">
    <label>용어집 (한 줄에 하나: 영어 = 한국어 표기)</label>
    <textarea id="gloss" rows="8"></textarea>
    <div class="row"><button id="btnSave" class="primary">설정 저장</button><button id="btnNew">새 회의 (기록 삭제)</button></div>
  </section>
</main>
<div id="interim"></div>

<script>
const $ = id => document.getElementById(id);
const S = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch{return d}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
const DEFAULT_GLOSS = "sell-in = 셀인(판매처 공급)\nsell-through = 셀스루(소비자 판매)\nMDF = MDF(마케팅 개발 지원금)\nSPIFF = 스피프(판매 인센티브)\nASP = ASP(평균판매가격)\ntariff = 관세\nSKU = SKU\nsell-out = 셀아웃\nbuilder channel = 빌더 채널\nBest Buy = Best Buy\nHome Depot = Home Depot\nLowe's = Lowe's\nWhirlpool = Whirlpool\nSamsung = 삼성";

let cfg = Object.assign({key:"",mTr:"claude-haiku-5-5",mMin:"claude-sonnet-5-5",lang:"en-US",speakers:"나,A,B,C",gloss:DEFAULT_GLOSS}, S.get("cfg",{}));
let segs = S.get("segs", []);
let curSpk = 0, running = false, rec = null, committing = false, silenceTimer = null, wakeLock = null, lastInterim = "";

/* ---------- UI ---------- */
document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
  document.querySelectorAll("[data-tab]").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "p-" + b.dataset.tab));
});
function loadCfgUI(){ $("key").value=cfg.key; $("mTr").value=cfg.mTr; $("mMin").value=cfg.mMin; $("lang").value=cfg.lang; $("speakers").value=cfg.speakers; $("gloss").value=cfg.gloss; renderSpk(); }
$("btnSave").onclick = () => {
  cfg = {key:$("key").value.trim(), mTr:$("mTr").value, mMin:$("mMin").value, lang:$("lang").value, speakers:$("speakers").value, gloss:$("gloss").value};
  S.set("cfg", cfg); renderSpk(); setStatus("설정 저장됨");
};
$("btnNew").onclick = () => { if(confirm("현재 회의 기록을 모두 삭제할까요?")){ stop(); segs=[]; S.set("segs",segs); $("list").innerHTML=""; $("minutes").value=""; } };
function speakers(){ return cfg.speakers.split(",").map(s=>s.trim()).filter(Boolean).slice(0,8); }
function renderSpk(){
  const el=$("spk"); el.innerHTML=""; const sp=speakers(); if(curSpk>=sp.length) curSpk=0;
  sp.forEach((n,i)=>{ const b=document.createElement("button"); b.textContent=n; b.className=i===curSpk?"on":""; b.onclick=()=>{curSpk=i;renderSpk()}; el.appendChild(b); });
}
function setStatus(t){ $("status").textContent=t; }
function hhmm(ts){ return new Date(ts).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false}); }

function renderSeg(seg){
  let el = document.getElementById("s"+seg.id);
  if(!el){ el=document.createElement("div"); el.className="seg"; el.id="s"+seg.id; $("list").appendChild(el); }
  el.innerHTML="";
  const m=document.createElement("div"); m.className="meta"; const b=document.createElement("b"); b.textContent=seg.spk; m.append(b," · "+hhmm(seg.ts)); el.appendChild(m);
  const ko=document.createElement("div");
  if(seg.err){ ko.className="err"; ko.textContent="⚠ "+seg.err+" (탭하여 재시도)"; ko.onclick=()=>translate(seg); }
  else { ko.className="ko"; ko.textContent=seg.ko||"…"; }
  el.appendChild(ko);
  const en=document.createElement("div"); en.className="en"; en.textContent=seg.en; el.appendChild(en);
  const main=document.querySelector("main"); const near = main.scrollHeight - main.scrollTop - main.clientHeight < 200; if(near) main.scrollTop=main.scrollHeight;
}

/* ---------- Claude API ---------- */
async function claude(model, system, user, max_tokens){
  if(!cfg.key) throw new Error("설정에서 API Key를 입력하세요");
  const r = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model,max_tokens,system,messages:[{role:"user",content:user}]})
  });
  if(!r.ok){ let t=""; try{t=(await r.json()).error.message}catch{} throw new Error(r.status+" "+t); }
  const j = await r.json();
  return j.content.filter(c=>c.type==="text").map(c=>c.text).join("").trim();
}

async function translate(seg){
  seg.err=null; renderSeg(seg);
  const idx = segs.indexOf(seg);
  const ctx = segs.slice(Math.max(0,idx-3), idx).map(s=>s.spk+": "+s.en).join("\n");
  const system = "You are a real-time simultaneous interpreter for English business meetings (home appliances, North America sales, retail channel, tariffs, P&L). Translate the final English utterance into natural, concise Korean business speech. Rules: output ONLY the Korean translation; no notes. Speech recognition may contain errors, so correct obvious mis-hearings using the context. Keep numbers, units, currency, and proper nouns accurate. Use the glossary for term consistency.\n\nGlossary:\n"+cfg.gloss;
  const user = "<context>\n"+(ctx||"(none)")+"\n</context>\n<utterance speaker=\""+seg.spk+"\">\n"+seg.en+"\n</utterance>";
  try{ seg.ko = await claude(cfg.mTr, system, user, 600); }
  catch(e){ seg.err = e.message; }
  S.set("segs",segs); renderSeg(seg);
}

/* ---------- Speech recognition ---------- */
function addSegment(text){
  text=text.trim(); if(!text) return;
  const seg={id:Date.now()+Math.floor(Math.random()*1000), ts:Date.now(), spk:speakers()[curSpk]||"?", en:text, ko:"", err:null};
  segs.push(seg); S.set("segs",segs); renderSeg(seg); translate(seg);
}
function startRec(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("이 브라우저는 음성 인식을 지원하지 않습니다. iPad의 Safari에서 열어주세요."); running=false; return; }
  rec = new SR(); rec.lang=cfg.lang; rec.continuous=true; rec.interimResults=true;
  committing=false; lastInterim="";
  rec.onresult = e => {
    if(committing) return;
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      if(r.isFinal){ clearTimeout(silenceTimer); addSegment(r[0].transcript); lastInterim=""; }
      else interim+=r[0].transcript;
    }
    lastInterim=interim; $("interim").textContent=interim;
    clearTimeout(silenceTimer);
    if(interim){ // iOS often delays isFinal: commit after short silence, then restart session
      silenceTimer=setTimeout(()=>{ if(lastInterim.trim()){ committing=true; addSegment(lastInterim); lastInterim=""; $("interim").textContent=""; try{rec.stop()}catch{} } },1600);
    }
  };
  rec.onerror = e => {
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){ running=false; setStatus("마이크/음성인식 권한 필요"); alert("설정 > Safari > 마이크 허용, 그리고 설정 > 일반 > 키보드 > 받아쓰기 활성화를 확인하세요."); }
  };
  rec.onend = () => { if(running){ setTimeout(()=>{ if(running) startRec(); },250); } else { $("interim").textContent=""; } };
  try{ rec.start(); }catch(e){ setTimeout(()=>{ if(running) startRec(); },500); }
}
async function keepAwake(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch{} }
document.addEventListener("visibilitychange",()=>{ if(running && document.visibilityState==="visible") keepAwake(); });

function start(){ running=true; $("btnRec").textContent="■ 중지"; $("btnRec").className="rec"; setStatus("듣는 중…"); keepAwake(); startRec(); }
function stop(){
  running=false; clearTimeout(silenceTimer);
  if(lastInterim.trim()){ addSegment(lastInterim); lastInterim=""; }
  try{ rec&&rec.stop(); }catch{}
  try{ wakeLock&&wakeLock.release(); }catch{}
  $("btnRec").textContent="● 시작"; $("btnRec").className="primary"; setStatus("중지됨"); $("interim").textContent="";
}
$("btnRec").onclick = () => running ? stop() : start();

/* ---------- Minutes ---------- */
function transcriptText(){
  return segs.map(s=>"["+hhmm(s.ts)+"] "+s.spk+": "+s.en+(s.ko?"\n    → "+s.ko:"")).join("\n");
}
$("btnMin").onclick = async () => {
  if(running) stop();
  if(!segs.length){ alert("기록된 내용이 없습니다."); return; }
  $("btnMin").disabled=true; $("minutes").value="회의록 작성 중…";
  const system = "당신은 글로벌 가전 기업 북미 영업 임원을 위한 회의록 작성 비서입니다. 영어 회의 스크립트(음성인식 기반이라 오류가 있을 수 있음)와 실시간 한국어 번역이 주어집니다. 오류는 문맥으로 보정하고, 한국어로 밀도 있게 작성하세요. 스크립트에 없는 내용은 추정하지 말고 '확인 필요'로 표시하세요. 숫자·고객사·제품명은 정확히 유지하세요.\n\n출력 형식(마크다운):\n# 회의록: {제목}\n- 일시/참석자\n## 1. 한 줄 요약\n## 2. 아젠다별 주요 논의\n## 3. 결정사항\n## 4. Action Items (표: 항목 | 담당 | 기한 | 비고)\n## 5. 미결 이슈 / 후속 확인 필요\n## 6. 리스크 및 전략적 쟁점 (상충하는 입장, 상대방의 요구와 당사 이해관계의 긴장 포함)\n\n용어집:\n"+cfg.gloss;
  const user = "제목: "+($("title").value||"(미입력)")+"\n참석자: "+($("attendees").value||"(미입력)")+"\n일시: "+new Date(segs[0].ts).toLocaleString("ko-KR")+"\n\n<transcript>\n"+transcriptText()+"\n</transcript>";
  try{ $("minutes").value = await claude(cfg.mMin, system, user, 4000); }
  catch(e){ $("minutes").value = "⚠ 생성 실패: "+e.message; }
  $("btnMin").disabled=false;
};
async function copyText(t){ try{ await navigator.clipboard.writeText(t); setStatus("복사됨"); }catch{ alert("복사 실패: 텍스트를 길게 눌러 직접 복사하세요."); } }
$("btnCopy").onclick = () => copyText($("minutes").value);
async function shareText(title,text,fname){
  if(navigator.share){ try{ await navigator.share({title,text}); return; }catch(e){ if(e.name==="AbortError") return; } }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"text/markdown"})); a.download=fname; a.click();
}
$("btnShare").onclick = () => shareText($("title").value||"회의록",$("minutes").value,"minutes.md");
$("btnTx").onclick = () => shareText("회의 스크립트",transcriptText(),"transcript.txt");

/* ---------- init ---------- */
loadCfgUI(); segs.forEach(renderSeg);
if(!cfg.key){ setStatus("설정 탭에서 API Key 입력"); }
</script>
</body>
</html>
